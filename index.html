<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Tracker</title>
<meta name="theme-color" content="#2f5d8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
:root{
  --bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d3dae1;
  --acc:#2f5d8a;--accink:#fff;--ok:#2e7d5b;--field:#f5f7f9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f151b;--card:#18212a;--ink:#e8edf2;--mute:#93a1ae;--line:#2b3742;--acc:#6fa3d6;--accink:#0f151b;--ok:#55b68a;--field:#111a22;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f151b;--card:#18212a;--ink:#e8edf2;--mute:#93a1ae;--line:#2b3742;--acc:#6fa3d6;--accink:#0f151b;--ok:#55b68a;--field:#111a22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:640px;margin:0 auto}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 0;font:inherit;font-size:16px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.tabs button.has::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--ok);margin:2px auto -5px}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hd h2{font-size:16px;margin:0}
.hd small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.lnk{border:0;background:transparent;color:var(--acc);font:inherit;font-size:14px;font-weight:600;padding:6px 4px;min-height:36px}
.row{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:8px;align-items:center;margin-top:8px}
.row b{font-size:13px;color:var(--mute);font-weight:600}
input[type=number],input[type=text]{width:100%;min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);padding:0 8px;font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chk{width:40px;height:40px;accent-color:var(--ok)}
.lbl{font-size:12px;color:var(--mute);display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:8px;margin-top:8px}
.note{color:var(--mute);font-size:14px;margin:6px 0 0}
.sets{display:flex;gap:12px;margin-top:6px}
.edit{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
.edit label{display:block;font-size:12px;color:var(--mute);margin:6px 0 2px}
.edit label:first-child{margin-top:0}
.erow{display:flex;gap:8px;margin-top:10px}
.actions{display:flex;gap:8px;margin:14px 0 24px}
.actions button{flex:1;height:46px;border-radius:10px;font:inherit;font-weight:600;border:1px solid var(--acc)}
.pri{background:var(--acc);color:var(--accink)}
.sec{background:transparent;color:var(--acc)}
.rest{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.ord{list-style:none;margin:0;padding:0}
.ord li{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:8px}
.ord li.drag{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.ord b{width:18px;color:var(--mute)}
.ord .nm{flex:1;font-weight:600}
.ord .lnk:disabled{opacity:.3}
.grip{width:44px;height:44px;display:grid;place-items:center;font-size:24px;color:var(--mute);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<header><div class="tabs" id="tabs" role="tablist"></div><div style="max-width:640px;margin:2px auto 0;text-align:right"><button class="lnk" id="rb" data-act="reorder">Rearrange days</button></div></header>
<main id="main"></main>
<script>
var DAYS=["1","2","3","4","5","6","7"];
var PLAN={
"1":{t:"Upper A",x:[["Bench press",4,"6-8"],["Barbell or cable row",4,"8-10"],["Overhead press",3,"8-10"],["Lat pulldown",3,"10-12"],["Lateral raises",3,"12-15"],["Triceps pushdown",3,"10-12"],["Curls",3,"10-12"]]},
"2":{t:"Lower A",x:[["Back squat",4,"6-8"],["Romanian deadlift",3,"8-10"],["Leg press",3,"10-12"],["Leg curl",3,"10-12"],["Standing calf raise",4,"10-15"]]},
"3":{t:"Easy ride",c:"45-60 min at zone 2, or rest. A swim also works.",x:[["Cardio session"]]},
"4":{t:"Upper B",x:[["Incline dumbbell press",4,"8-10"],["Pull-ups or chin-ups",4,"6-10"],["Seated dumbbell press",3,"10-12"],["Chest-supported row",3,"10-12"],["Cable fly",3,"12-15"],["Rear delt fly",3,"12-15"],["Hammer curl",3,"10-12"],["Overhead triceps extension",3,"10-12"]]},
"5":{t:"Lower B",x:[["Deadlift or trap-bar deadlift",3,"5"],["Bulgarian split squat (per leg)",3,"8-10"],["Hip thrust",3,"8-10"],["Leg extension",3,"12-15"],["Leg curl",3,"10-12"],["Seated calf raise",4,"12-15"]]},
"6":{t:"Long ride",c:"25-50 miles at an easy to moderate pace.",x:[["Cardio session"]]},
"7":{t:"Rest day"}
};
var S={cur:{},last:{},mod:{},day:null,order:["1","2","3","4","5","6","7"]};
try{var raw=localStorage.getItem("trk2");if(raw){var p=JSON.parse(raw);if(p&&p.cur&&p.last){S.cur=p.cur;S.last=p.last;S.mod=p.mod||{};S.day=p.day||null;if(p.order&&p.order.length===7&&p.order.slice().sort().join("")==="1234567")S.order=p.order}}}catch(e){}
function save(){try{localStorage.setItem("trk2",JSON.stringify(S))}catch(e){}}
var slot=S.day&&PLAN[S.day]?S.day:String((new Date().getDay()+6)%7+1);var day=S.order[slot-1];var reorder=false;
var editing=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function hasData(d){for(var k in S.cur){if(k.indexOf(d+"-")===0)return true}return false}
function ex(i){
  var e=PLAN[day].x[i],m=S.mod[day+"-"+i]||{};
  return{o:e[0],n:m.n?m.n:e[0],s:e[1]?(m.s!==undefined?m.s:e[1]):0,r:m.r!==undefined?m.r:(e[2]||"")};
}
function renderTabs(){
  var h="";
  DAYS.forEach(function(d){h+='<button role="tab" aria-label="Day '+d+'" aria-selected="'+(d===slot)+'" class="'+(hasData(S.order[d-1])?"has":"")+'" data-day="'+d+'">'+d+'</button>'});
  document.getElementById("tabs").innerHTML=h;
}
function render(){day=S.order[slot-1];
  renderTabs();
  document.getElementById("rb").textContent=reorder?"Done rearranging":"Rearrange days";if(reorder){renderOrder();return}var p=PLAN[day],h='<h1>Day '+slot+' · '+p.t+'</h1>';
  if(!p.x){h+='<div class="rest">Take the day off. Sleep and food do the work today.</div>';document.getElementById("main").innerHTML=h;return}
  h+='<p class="sub">'+(p.c?p.c:'Stay 1-2 reps short of failure. Add weight when every set hits the top of the range.')+'</p>';
  p.x.forEach(function(b,i){
    var e=ex(i),isEd=editing===day+"-"+i,swapped=e.n!==e.o;
    h+='<section class="ex"><div class="hd"><h2>'+esc(e.n)+'<small>'+(e.s?e.s+' × '+esc(e.r):esc(e.r))+(swapped?' · replaces '+esc(e.o):'')+'</small></h2>'
     +'<button class="lnk" data-act="edit" data-i="'+i+'">'+(isEd?'Close':'Edit')+'</button></div>';
    if(isEd){
      h+='<div class="edit"><label for="en'+i+'">Exercise name</label><input type="text" id="en'+i+'" data-e="n" data-i="'+i+'" value="'+esc(e.n)+'">'
       +'<label for="er'+i+'">'+(e.s?'Rep target':'Target')+'</label><input type="text" id="er'+i+'" data-e="r" data-i="'+i+'" value="'+esc(e.r)+'">'
       +'<div class="erow"><button class="lnk" data-act="reset" data-i="'+i+'">Reset to original</button></div></div>';
    }
    if(e.s){
      h+='<div class="lbl"><span></span><span>Weight (lb)</span><span>Reps</span><span></span></div>';
      for(var s=0;s<e.s;s++){
        var k=day+"-"+i+"-"+s,c=S.cur[k]||{},l=S.last[k]||{};
        if(l.n!==undefined&&l.n!==e.n){l={}}
        h+='<div class="row"><b>'+(s+1)+'</b>'
         +'<input type="number" inputmode="decimal" aria-label="Set '+(s+1)+' weight" data-k="'+k+'" data-f="w" value="'+(c.w!==undefined?c.w:"")+'" placeholder="'+(l.w!==undefined?l.w:"")+'">'
         +'<input type="number" inputmode="numeric" aria-label="Set '+(s+1)+' reps" data-k="'+k+'" data-f="r" value="'+(c.r!==undefined?c.r:"")+'" placeholder="'+(l.r!==undefined?l.r:"")+'">'
         +'<input class="chk" type="checkbox" aria-label="Set '+(s+1)+' done" data-k="'+k+'" data-f="d"'+(c.d?" checked":"")+'></div>';
      }
      h+='<div class="sets"><button class="lnk" data-act="add" data-i="'+i+'">+ Add set</button>'+(e.s>1?'<button class="lnk" data-act="rem" data-i="'+i+'">− Remove last set</button>':'')+'</div>';
    }else{
      var k2=day+"-"+i+"-0",c2=S.cur[k2]||{},l2=S.last[k2]||{};
      if(l2.n!==undefined&&l2.n!==e.n){l2={}}
      h+='<div class="lbl"><span></span><span>Minutes</span><span>Miles</span><span></span></div><div class="row"><b></b>'
       +'<input type="number" inputmode="decimal" aria-label="Minutes" data-k="'+k2+'" data-f="w" value="'+(c2.w!==undefined?c2.w:"")+'" placeholder="'+(l2.w!==undefined?l2.w:"")+'">'
       +'<input type="number" inputmode="decimal" aria-label="Miles" data-k="'+k2+'" data-f="r" value="'+(c2.r!==undefined?c2.r:"")+'" placeholder="'+(l2.r!==undefined?l2.r:"")+'">'
       +'<input class="chk" type="checkbox" aria-label="Done" data-k="'+k2+'" data-f="d"'+(c2.d?" checked":"")+'></div>';
    }
    h+='</section>';
  });
  h+='<div class="actions"><button class="sec" data-act="clr">Clear day</button><button class="pri" data-act="fin">Finish session</button></div>';
  h+='<p class="note">Grey numbers in the boxes show what you logged last session.</p>';
  document.getElementById("main").innerHTML=h;
}
function renderOrder(){
  var h='<h1>Rearrange days</h1><p class="sub">Drag the handle or use the arrows. Day numbers stay put and the workouts move.</p><ul class="ord" id="ord">';
  S.order.forEach(function(w,j){
    h+='<li data-w="'+w+'"><b>'+(j+1)+'</b><span class="nm">'+PLAN[w].t+'</span><button class="lnk" data-act="up" data-j="'+j+'" aria-label="Move up"'+(j===0?' disabled':'')+'>▲</button><button class="lnk" data-act="dn" data-j="'+j+'" aria-label="Move down"'+(j===6?' disabled':'')+'>▼</button><span class="grip" aria-hidden="true">≡</span></li>';
  });
  h+='</ul><div class="actions"><button class="sec" data-act="rst">Reset order</button><button class="pri" data-act="reorder">Done</button></div>';
  document.getElementById("main").innerHTML=h;
}
var drag=null;
document.addEventListener("pointerdown",function(ev){
  var g=ev.target.closest&&ev.target.closest(".grip");if(!g)return;
  drag=g.closest("li");drag.classList.add("drag");ev.preventDefault();
});
document.addEventListener("pointermove",function(ev){
  if(!drag)return;
  var ul=drag.parentNode,items=[].slice.call(ul.children),cur=items.indexOf(drag),idx=0;
  items.forEach(function(x){if(x!==drag){var r=x.getBoundingClientRect();if(ev.clientY>r.top+r.height/2)idx++}});
  while(cur>idx){ul.insertBefore(drag.previousSibling,drag.nextSibling);cur--}
  while(cur<idx){ul.insertBefore(drag.nextSibling,drag);cur++}
  [].forEach.call(ul.children,function(x,n){x.firstChild.textContent=n+1});
});
function endDrag(){
  if(!drag)return;
  var ul=drag.parentNode;
  S.order=[].map.call(ul.children,function(x){return x.dataset.w});
  drag=null;save();render();
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);
document.addEventListener("click",function(ev){
  var t=ev.target.closest("button");if(!t)return;
  var d=t.dataset.day,a=t.dataset.act,i=t.dataset.i,mk=day+"-"+i;
  if(d){slot=d;S.day=d;editing=null;reorder=false;save();render();window.scrollTo(0,0);return}if(a==="reorder"){reorder=!reorder;editing=null;render();return}if(a==="up"||a==="dn"){var j=+t.dataset.j,q=a==="up"?j-1:j+1;if(q>=0&&q<7){var tmp=S.order[j];S.order[j]=S.order[q];S.order[q]=tmp;save();render()}return}if(a==="rst"){S.order=["1","2","3","4","5","6","7"];save();render();return}
  if(a==="edit"){editing=editing===mk?null:mk;render();return}
  if(a==="reset"){delete S.mod[mk];save();render();return}
  if(a==="add"){var e=ex(+i);var m=S.mod[mk]||(S.mod[mk]={});m.s=Math.min(e.s+1,12);save();render();return}
  if(a==="rem"){var e2=ex(+i);if(e2.s>1){delete S.cur[mk+"-"+(e2.s-1)];var m2=S.mod[mk]||(S.mod[mk]={});m2.s=e2.s-1;save();render()}return}
  if(a==="clr"){Object.keys(S.cur).forEach(function(k){if(k.indexOf(day+"-")===0)delete S.cur[k]});save();render();return}
  if(a==="fin"){
    Object.keys(S.cur).forEach(function(k){
      if(k.indexOf(day+"-")===0){var c=S.cur[k];if(c.w!==undefined||c.r!==undefined){S.last[k]={w:c.w,r:c.r,n:ex(+k.split("-")[1]).n}}delete S.cur[k]}
    });
    save();render();
  }
});
function onEdit(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.e){
    var mk=day+"-"+t.dataset.i,m=S.mod[mk]||(S.mod[mk]={});
    m[t.dataset.e]=t.value;save();return;
  }
  var k=t.dataset&&t.dataset.k;
  if(!k)return;
  var f=t.dataset.f,o=S.cur[k]||(S.cur[k]={});
  if(f==="d"){o.d=t.checked}else{if(t.value===""){delete o[f]}else{o[f]=t.value}}
  if(!o.d&&o.w===undefined&&o.r===undefined){delete S.cur[k]}
  save();renderTabs();
}
document.addEventListener("input",onEdit);
document.addEventListener("change",onEdit);
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
